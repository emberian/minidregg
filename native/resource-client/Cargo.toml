[package]
name = "minidregg-resource-client"
version = "0.1.0"
edition = "2021"
description = "Physical custody and exact-retry client for the Lean-owned Mini host."
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "mini"
path = "src/main.rs"

[dependencies]
libc = "=0.2.189"
# Client-general custody primitives: durable writes, flock, secret-file loading, hex, decimals.
mini-sdk = { package = "minidregg-mini-sdk", path = "../mini-sdk", features = ["native"] }
bs58 = "=0.5.1"
compatible-upgrade-custody = { package = "minidregg-compatible-upgrade-custody", path = "../compatible-upgrade-custody" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
sha2 = "=0.10.9"
ring = "=0.17.14"
x509-parser = "=0.18.1"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
sha3 = "=0.10.8"
zeroize = "=1.9.0"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["non-fips"] }
# Seeded ML-KEM-768 key generation (EVP_PKEY_keygen_deterministic): the same crate
# and version aws-lc-rs already links; aws-lc-rs exposes no seeded keygen.
aws-lc-sys = { version = "=0.45.0", default-features = false }

# The key broker's client side (wire, peer check, client); no crypto, no custody.
minidregg-mini-keys = { path = "../mini-keys", default-features = false }
# The same bounded HTTP transport serves RPC observation and paid cold entry.
minidregg-pay-watcher = { path = "../pay-watcher" }

[dev-dependencies]
# The broker itself, so the member exchange is tested against the real server.
minidregg-mini-keys = { path = "../mini-keys" }
