[package]
name = "minidregg-resource-client"
version = "0.1.0"
edition = "2021"
description = "Physical custody and exact-retry client for the Lean-owned Mini host."
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "mini"
path = "src/main.rs"

[dependencies]
bs58 = "=0.5.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
serde_json = "=1.0.151"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
sha2 = "=0.10.9"
x509-parser = "=0.18.1"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
sha3 = "=0.10.8"
zeroize = "=1.9.0"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
