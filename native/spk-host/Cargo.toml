[package]
name = "minidregg-spk-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Physical Linux custody and sandbox launch for Sandstorm SPK grains"

[[bin]]
name = "spk-host"
path = "src/main.rs"

[dependencies]
libc = "=0.2.177"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
sandstorm-package = { git = "https://github.com/emberian/dregg.git", rev = "5819115352bdfa43c5cbd329727d4f8d8a1b5be9" }
minidregg-spk-rpc = { path = "../spk-rpc" }
tokio = { version = "=1.48.0", features = ["net", "rt", "time", "io-util", "process", "sync"] }
