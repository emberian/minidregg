[package]
name = "minidregg-fhe-bend"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
[workspace]
[dependencies]
fhe = { path = "vendor/fhe-dregg", default-features = false }
fhe-traits = "=0.1.1"
fhe-math = "=0.1.1"
rand = "=0.9.4"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
prost = "=0.14.4"
[[bin]]
name = "fhe-bend"
path = "src/main.rs"
[[bin]]
name = "fhe-bend-owner"
path = "src/owner.rs"
