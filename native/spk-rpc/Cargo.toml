[package]
name = "minidregg-spk-rpc"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Private Sandstorm application Cap'n Proto supervisor transport"

[dependencies]
capnp = "=0.27.0"
capnp-rpc = "=0.27.0"
futures = "=0.3.32"
serde_json = "=1.0.151"
tokio = { version = "=1.48.0", features = ["net", "rt", "macros", "time"] }
tokio-util = { version = "=0.7.17", features = ["compat"] }

[build-dependencies]
capnpc = "=0.27.0"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["net", "rt", "macros", "time"] }
