[package]
name = "minidregg-grain-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Physical supervisor for Mini agent-grain tasks"

[[bin]]
name = "grain-runtime"
path = "src/main.rs"

[[bin]]
name = "grain-provider-bridge"
path = "src/provider_bridge.rs"

[dependencies]
libc = "=0.2.177"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
