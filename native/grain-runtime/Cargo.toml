[package]
name = "minidregg-grain-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Physical supervisor for Mini agent-grain tasks"

[[bin]]
name = "grain-runtime"
path = "src/main.rs"

[[bin]]
name = "grain-provider-bridge"
path = "src/provider_bridge.rs"

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
ring = "=0.17.14"
minidregg-signed-api-path = { path = "../signed-api-path" }
minidregg-inference-scheduler = { path = "../inference-scheduler" }
minidregg-compatible-upgrade-custody = { path = "../compatible-upgrade-custody" }
# The key broker client: the controller asks it for tickets and sends through it; it holds no key.
minidregg-mini-keys = { path = "../mini-keys", default-features = false }

[dev-dependencies]
# The broker itself, so the gateway tests send through a real one.
minidregg-mini-keys = { path = "../mini-keys" }
