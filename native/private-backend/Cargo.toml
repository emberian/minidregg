[package]
name = "mini-private-backend"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
[dependencies]
sha2 = "=0.10.9"
libc = "=0.2.189"
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["non-fips"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ring = "=0.17.14"
sha3 = "=0.10.8"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "=1.9.0"
# Seeded ML-KEM-768 key generation (hybrid_kem.rs): the crate and version aws-lc-rs links.
aws-lc-sys = { version = "=0.45.0", default-features = false }

[workspace]
