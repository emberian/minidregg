[package]
name = "minidregg-inference-scheduler"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Shared physical placement for Mini-authorized homelab inference"

[[bin]]
name = "mini-inference-scheduler"
path = "src/main.rs"

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
