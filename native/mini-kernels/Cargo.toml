[package]
name = "mini-kernels"
version = "0.1.0"
edition = "2021"
description = "The Rust kernels the compiled Lean host calls through @[extern]: cSHAKE256, KMAC256 (SP 800-185), and opaque Ed25519/SSHSIG verification. Lean owns framing and admission; pinned vectors pin the byte computations and crypto verdicts."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sha3 = "0.10"
keccak = "=0.1.6"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
