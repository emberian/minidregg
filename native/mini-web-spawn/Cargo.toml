[package]
name = "minidregg-mini-web-spawn"
version = "0.1.0"
edition = "2021"
description = "The web front end's root helper: spawns `mini shell` and `mini web --body` as a hosted member under a pty, and holds the browser sessions the door issued."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "mini_web_spawn"
path = "src/lib.rs"

[[bin]]
name = "mini-web-spawn"
path = "src/main.rs"

[dependencies]
minidregg-mini-session-env = { path = "../mini-session-env" }
minidregg-mini-streams = { path = "../mini-streams" }
libc = "=0.2.189"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
