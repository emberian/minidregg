name = "minidregg"
defaultTargets = ["Minidregg"]
# Restore every artifact a build takes from the Lake artifact cache INTO .lake/build (hard links), so
# `lake env lean`, lane-check and lean-ask see a fetched module like a compiled one. The cache itself
# is enabled per box by scripts/pipeline/lake-shim (LAKE_ARTIFACT_CACHE + one shared LAKE_CACHE_DIR):
# a low-level edit is compiled once per box, not once per lane.
restoreAllArtifacts = true

# Pin mathlib to the exact revision matching v4.30.0
# (rev 1c2b90b13009c65b090d95a83c98e248deafb6f1). This is a PORTABLE `git`+`rev`
# require: `lake` fetches mathlib itself into `.lake/packages/mathlib` on any host,
# with NO assumption about where the repo was cloned. (In breadstuffs this replaced
# a host-fragile `path = "../../../src/mathlib4"` local require that only resolved
# when the repo was cloned exactly two levels under $HOME with mathlib as a
# $HOME/src sibling — which broke a fresh Linux cold-bootstrap on lassie. See
# breadstuffs' docs/LEAN-SEED-ARTIFACT.md.)
#
# LOCAL FAST PATH (optional, no re-download): if you already have a warm mathlib
# checkout at the pinned rev, symlink it into the packages dir BEFORE the first
# `lake build` so lake reuses it instead of cloning + re-fetching oleans:
#     ln -sfn /path/to/your/mathlib4 .lake/packages/mathlib
# (`.lake/` is gitignored + per-machine; this changes nothing committed.)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1c2b90b13009c65b090d95a83c98e248deafb6f1"

# Stable root library. Additional qualification roots and opt-in source-first
# research coverage are declared below; see docs/LEAN-QUALIFICATION.md.
[[lean_lib]]
name = "Minidregg"

# Theory/ — the candidate-independent core (verify/find seam, Holds, …).
# Import boundary MECHANICALLY enforced: scripts/check-import-boundary.sh fails
# if any Theory/ file imports anything outside Mathlib + Theory itself.
[[lean_lib]]
name = "Theory"

# Kernel/ — the 3 verbs (create · gwrite · move) over the product camera; the
# hyperedge as THE turn shape.
[[lean_lib]]
name = "Kernel"

# Pred/ — the ONE predicate algebra, syntactic AST end-to-end.
[[lean_lib]]
name = "Pred"

# Effects/ — the open handler registry: one declaration per effect, all floor
# obligations as proof fields.
[[lean_lib]]
name = "Effects"

# Compiler/ — the arithmetization spine: syntactic-leaf IR + fold_unique.
[[lean_lib]]
name = "Compiler"

# Selvage/ — the proof system. Also import-boundary-checked: Selvage/ may import only
# Mathlib, Theory, and Selvage.
[[lean_lib]]
name = "Selvage"

# Assurance/ — cross-boundary apex theorems. Hand-written; axiom pins are
# `#guard_msgs in #print axioms` lines beside each theorem, not generated.
[[lean_lib]]
name = "Assurance"

# Source-owned native receiving process. Explicit target: never a substitute
# for the full Minidregg integration gate.
[[lean_lib]]
name = "Host"

[[lean_exe]]
name = "minidregg-host"
root = "Host.Main"

# Local custody consent, selected separately from the remote Host image.
# The base entry refuses unsupported higher lifecycle families explicitly.
[[lean_exe]]
name = "minidregg-client-consent"
root = "Host.ClientConsentSession"

[[lean_exe]]
name = "minidregg-client-consent-specialized"
root = "Host.ClientConsentSpecializedSession"

# B2 exit measurement: wall-clock of the compiled Kernel.World.fold over a
# 1000-turn log (Kernel.WorldBench). Not part of the umbrella gate.
[[lean_exe]]
name = "world-fold-bench"
root = "Host.WorldFoldBench"

# Wall-clock of the compiled world root (Kernel.WorldRoot). Not part of the umbrella gate.
[[lean_exe]]
name = "world-root-bench"
root = "Host.WorldRootBench"

# KN2-STORE-OPEN: Store open / first read / append at a given history length
# (Host/Kn2StoreBench.lean). Not part of the umbrella gate.
[[lean_exe]]
name = "kn2-store-bench"
root = "Host.Kn2StoreBench"

# The compiled Theory.Nock interpreter behind a CLI (stdin: jam of [subject formula];
# see Host/NockEval.lean). Driven by the nockvm differential harness. Not part of the umbrella gate.
[[lean_exe]]
name = "nock-eval"
root = "Host.NockEval"

# The tree-wide axiom check (Theory/AssertAxioms.lean's `#assert_axioms_tree`
# over the umbrella). Built by scripts/lane/ub.sh.
[[lean_lib]]
name = "AxiomCensus"

# UMBRELLA-SPLIT: the deployed umbrella (no Selvage, no proof-system Assurance)
# and the research census over the whole tree (`Minidregg`).
[[lean_lib]]
name = "Deployed"

[[lean_lib]]
name = "AxiomCensusResearch"

# HOST-KECCAK: throughput of the compiled cSHAKE256/KMAC256 (Host.CshakeBench). Not part of the umbrella gate.
# The C-vs-Lean differential's native drivers (native/objective-emit/differential.py,
# scripts/check-objective-proofs.sh cgen): the Lean reference side and the seeded
# generator of well-typed Core4 programs. Compiled, not interpreted: a differential
# run is thousands of `runBounded` executions.
[[lean_exe]]
name = "objective-cdiff"
root = "Compiler.ObjectiveBendEmitCRun"

[[lean_exe]]
name = "objective-cdiff-gen"
root = "Compiler.ObjectiveBendCDiffGen"

[[lean_exe]]
name = "cshake-bench"
root = "Host.CshakeBench"

# Narrow explicit old-capsule carry verifier; no full Host receiving surface.
[[lean_exe]]
name = "minidregg-carry-verifier"
root = "Host.CarryVerifierMain"

# Explicit qualification roots. Compilation does not imply native deployment.
[[lean_lib]]
name = "Verify"

[[lean_lib]]
name = "SimplexQualification"

# Objective Bend Core4 metatheory (proofs over the default-build definitions in
# Theory/ObjectiveBend*). Gated separately: `lake build ObjectiveProofs`.
[[lean_lib]]
name = "ObjectiveProofs"

# Source-first research is an explicit opt-in build.
[[lean_lib]]
name = "ResearchWip"

# Pure-kernel Generic Simplex event harness, incl. the timed 00f711 stall
# reproduction and backoff recovery (compiled; run the binary).
[[lean_exe]]
name = "generic-simplex-harness"
root = "Verify.GenericSimplexHarness"

# Reopen of 100 000-entry agreement journals in constant stack (compiled; run the binary).
[[lean_exe]]
name = "generic-simplex-log-reopen"
root = "Verify.GenericSimplexLogReopen"

# The four-source agreement fixture: init, serve-replica (one standing replica
# process), await-call, run, lookup-all-call, convert-journal.
[[lean_exe]]
name = "minidregg-four-source-fixture"
root = "Verify.NativeJointSourceFixture"

# Per-operation cost of the agreement engine over a long busy run (compiled; run the binary).
[[lean_exe]]
name = "generic-simplex-load"
root = "Verify.GenericSimplexLoad"
