[package]
name = "minidregg-prover"
version = "0.1.0"
edition = "2021"
description = "Unverified prover for minidregg: reads the ConstraintDescriptor emitted by Compiler/Emit.lean. Consumes constraints; never authors them."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# [PROVER-fri-wgsl]: the adopted GPU compute backend (wgpu -> Metal on ember's
# Mac) for OUR fri_fold.wgsl kernel. Per docs/PROVER-PLAN.md: wgpu/pollster/
# bytemuck are allowed; the Plonky3 stack (p3-*) is NOT.
wgpu = "23"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
